<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Der letzte Zug – Das Finanzspiel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Start Logo -->
    <div id="splashScreen">
        <h1>DER LETZTE ZUG</h1>
    </div>


    <!-- Hauptmenü -->

    <div id="mainMenu">

        <!-- Hintergrund Logo -->
        <div class="backgroundLogo">
            <h1>DER LETZTE ZUG</h1>
            <p>Das Finanzspiel</p>
        </div>


        <!-- Level Karte -->

        <div class="levelCard">

            <h2>Level 1</h2>
            <p>Arbeiter</p>

            <div class="levelBar">
                <div class="levelProgress"></div>
            </div>

        </div>


        <!-- Rechte Menü Karten -->

        <div class="sideMenu">

            <button>
                📖<br>
                Anleitung
            </button>

            <button>
                📊<br>
                Statistiken
            </button>

            <button>
                ⚙️<br>
                Einstellungen
            </button>

        </div>


        <!-- Spielen -->

        <div class="playArea">

            <button id="playButton">
                SPIELEN
            </button>

        </div>


    </div>


<script src="app.js"></script>

</body>

</html>
