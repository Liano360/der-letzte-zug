<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Der letzte Zug – Das Finanzspiel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Startanimation -->
    <div id="splashScreen">
        <h1>DER LETZTE ZUG</h1>
    </div>

    <!-- Hauptmenü -->
    <div id="mainMenu" class="screen active">

        <!-- Level -->
        <div class="levelCard">
            <h2>Level 1</h2>
            <p>Arbeiter</p>

            <div class="levelBar">
                <div class="levelProgress"></div>
            </div>
        </div>

        <!-- Menü rechts -->
        <div class="sideMenu">
            <button id="tutorialBtn">Anleitung</button>
            <button id="statsBtn">Statistiken</button>
            <button id="settingsBtn">Einstellungen</button>
        </div>

        <!-- Spielen -->
        <div class="playArea">
            <button id="playButton">SPIELEN</button>
        </div>

    </div>

<!-- Spielverwaltung -->

<div id="playScreen" class="screen">

    <!-- Zurück -->
    <button class="smallBackButton">
        ← Zurück
    </button>


    <!-- Titel -->

    <h1 class="menuTitle">
        Spielen
    </h1>


    <!-- Buttons Mitte -->

    <div class="gameStartButtons">

        <button id="newGameButton" class="appleButton">
            Neues Spiel
        </button>


        <button id="loadGameButton" class="appleButton">
            Spiel laden
        </button>

    </div>


    <!-- Starten -->

    <button id="startButton" class="startButton">

        Starten

    </button>


</div>



<!-- Neues Spiel Popup -->

<div id="newGamePopup" class="popup">

    <div class="popupBox">

        <h2>
            Neues Spiel
        </h2>


        <input 
        id="gameNameInput"
        type="text"
        placeholder="Name des Spiels">


        <button id="saveGameName">
            Speichern
        </button>


    </div>

</div>



<!-- Laden Popup -->

<div id="loadGamePopup" class="popup">

    <div class="popupBox">

        <h2>
            Spiele laden
        </h2>


        <div id="saveList">

            Keine gespeicherten Spiele

        </div>


        <button class="closePopup">
            Schließen
        </button>


    </div>

</div>

    <!-- Anleitung -->
    <div id="tutorialScreen" class="screen">

        <h1>Anleitung</h1>

        <p>Hier kommt später die komplette Spielanleitung.</p>

        <button class="backButton">← Zurück</button>

    </div>

    <!-- Statistik -->
    <div id="statsScreen" class="screen">

        <h1>Statistiken</h1>

        <p>Gesamt verdient: 0 €</p>

        <button class="backButton">← Zurück</button>

    </div>

    <!-- Einstellungen -->
    <div id="settingsScreen" class="screen">

        <h1>Einstellungen</h1>

        <p>Hier kommen später die Einstellungen.</p>

        <button class="backButton">← Zurück</button>

    </div>

    <script src="app.js"></script>

</body>
</html>
