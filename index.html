<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Der letzte Zug – Das Finanzspiel</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =================================
         STARTANIMATION
    ================================== -->

    <div id="splashScreen">

        <div class="logo">
            Der letzte Zug
        </div>

        <div id="versionText">
            Beta 0.4.1
        </div>

    </div>



    <!-- =================================
         HAUPTMENÜ
    ================================== -->

    <div
        id="mainMenu"
        class="screen active"
    >

        <!-- Level -->

        <div class="levelCard">

            <h2>
                Level 1
            </h2>

            <p>
                Arbeiter
            </p>

            <div class="levelBar">

                <div class="levelProgress"></div>

            </div>

        </div>


        <!-- Menü rechts -->

        <div class="sideMenu">

            <button id="tutorialBtn">
                Anleitung
            </button>

            <button id="statsBtn">
                Statistiken
            </button>

            <button id="settingsBtn">
                Einstellungen
            </button>

        </div>


        <!-- Spielen -->

        <div class="playArea">

            <button id="playButton">
                SPIELEN
            </button>

        </div>

    </div>



    <!-- =================================
         SPIELEN
    ================================== -->

    <div
        id="playScreen"
        class="screen"
    >

        <!-- Zurück -->

        <button class="smallBackButton">
            ← Zurück
        </button>


        <!-- Titel -->

        <h1 class="menuTitle">
            Spielen
        </h1>


        <!-- Spielauswahl -->

        <div class="gameStartButtons">

            <button
                id="newGameButton"
                class="appleButton"
            >
                Neues Spiel
            </button>


            <button
                id="loadGameButton"
                class="appleButton"
            >
                Spiel laden
            </button>

        </div>


        <!-- Starten -->

        <button
            id="startButton"
            class="startButton"
        >
            Starten
        </button>

    </div>



    <!-- =================================
         ANLEITUNG
    ================================== -->

    <div
        id="tutorialScreen"
        class="screen"
    >

        <button class="smallBackButton">
            ← Zurück
        </button>


        <h1 class="menuTitle">
            Anleitung
        </h1>

    </div>



    <!-- =================================
         STATISTIKEN
    ================================== -->

    <div
        id="statsScreen"
        class="screen"
    >

        <button class="smallBackButton">
            ← Zurück
        </button>


        <h1 class="menuTitle">
            Statistiken
        </h1>

    </div>



    <!-- =================================
         EINSTELLUNGEN
    ================================== -->

    <div
        id="settingsScreen"
        class="screen"
    >

        <button class="smallBackButton">
            ← Zurück
        </button>


        <h1 class="menuTitle">
            Einstellungen
        </h1>

    </div>



    <!-- =================================
         NEUES SPIEL POPUP
    ================================== -->

    <div
        id="newGamePopup"
        class="popup"
    >

        <div class="popupBox">

            <h2>
                Neues Spiel
            </h2>


            <input
                id="gameNameInput"
                type="text"
                placeholder="Name des Spiels"
            >


            <button id="saveGameName">
                Speichern
            </button>

        </div>

    </div>



    <!-- =================================
         SPIEL LADEN POPUP
    ================================== -->

    <div
        id="loadGamePopup"
        class="popup"
    >

        <div class="popupBox">

            <h2>
                Spiele laden
            </h2>


            <div id="saveList">

                Keine gespeicherten Spiele

            </div>


            <button class="closePopup">
                Schließen
            </button>

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
