<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Der letzte Zug – Das Finanzspiel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Start Logo -->

<div id="splashScreen">
    <h1>DER LETZTE ZUG</h1>
</div>


<!-- Hauptmenü -->

<div class="screen" id="mainMenu">

    <div class="levelCard">

        <h2>Level 1</h2>
        <p>Arbeiter</p>

        <div class="levelBar">
            <div class="levelProgress"></div>
        </div>

    </div>


    <div class="sideMenu">

        <button onclick="openScreen('tutorialScreen')">
            Anleitung
        </button>

        <button onclick="openScreen('statsScreen')">
            Statistiken
        </button>

        <button onclick="openScreen('settingsScreen')">
            Einstellungen
        </button>

    </div>


    <div class="playArea">

        <button id="playButton" onclick="openScreen('startScreen')">
            SPIELEN
        </button>

    </div>

</div>



<!-- Start Auswahl -->

<div class="screen hidden" id="startScreen">

    <h1>Start auswählen</h1>

    <button>
        Urlaub
    </button>

    <button>
        Alltag
    </button>

    <button onclick="openScreen('mainMenu')">
        Zurück
    </button>

</div>



<!-- Anleitung -->

<div class="screen hidden" id="tutorialScreen">

    <h1>Anleitung</h1>

    <p>
        Hier erklären wir später das Spiel.
    </p>

    <button onclick="openScreen('mainMenu')">
        Zurück
    </button>

</div>



<!-- Statistiken -->

<div class="screen hidden" id="statsScreen">

    <h1>Statistiken</h1>

    <p>
        Gesamt verdient: 0 €
    </p>

    <button onclick="openScreen('mainMenu')">
        Zurück
    </button>

</div>



<!-- Einstellungen -->

<div class="screen hidden" id="settingsScreen">

    <h1>Einstellungen</h1>

    <p>
        Einstellungen kommen später.
    </p>

    <button onclick="openScreen('mainMenu')">
        Zurück
    </button>

</div>



<script src="app.js"></script>

</body>

</html>
